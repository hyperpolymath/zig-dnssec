# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Builds and tests the zig-dnssec library with the Zig release pinned in
# mise.lock. The toolchain is fetched from ziglang.org and checked against
# its published SHA-256 (no third-party setup action).
name: Zig CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ZIG_VERSION: "0.17.0"
      ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Zig (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Formatting
        run: zig fmt --check build.zig src/root.zig src/wire src/dnssec src/stub src/cli src/interface/ffi tests

      - name: Unit, RFC-vector, denial, replay, fuzz-corpus and C ABI tests
        run: zig build test --summary all

      - name: ReleaseSafe build
        run: zig build -Doptimize=ReleaseSafe

      - name: Short fuzz run (standalone mutation fuzzer, fixed seed)
        run: |
          zig build fuzz-tool -Doptimize=ReleaseSafe
          ./zig-out/bin/dnssec-fuzz all 20 0x2026

  # The Idris2 side of the ABI seam: typecheck the proofs, then run the
  # Idris2 -> C ABI -> Zig end-to-end test. Idris2 is built from a pinned
  # release commit (it has no checksummed binary release).
  abi-seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ZIG_VERSION: "0.17.0"
      ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
      IDRIS2_TAG: "v0.7.0"
      IDRIS2_COMMIT: "27780073c8631826d846499840b3857d9b9a4fd5"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Zig (checksum-verified)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # PROOF-POLICY §6 deviation (state: open): Idris2 is built from its
      # pinned release commit here, not installed through build/guix.scm or the
      # container. Neither is available on the CI runner. The commit is asserted
      # below. Record: docs/status/PROOF-STATUS.adoc, "Toolchain deviations".
      - name: Build Idris2 from the pinned release commit
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q chezscheme libgmp-dev
          git clone -q --depth 1 --branch "$IDRIS2_TAG" https://github.com/idris-lang/Idris2.git "$RUNNER_TEMP/idris2-src"
          test "$(git -C "$RUNNER_TEMP/idris2-src" rev-parse HEAD)" = "$IDRIS2_COMMIT"
          make -C "$RUNNER_TEMP/idris2-src" bootstrap SCHEME=chezscheme PREFIX="$RUNNER_TEMP/idris2" -j"$(nproc)"
          make -C "$RUNNER_TEMP/idris2-src" install PREFIX="$RUNNER_TEMP/idris2"
          echo "$RUNNER_TEMP/idris2/bin" >> "$GITHUB_PATH"

      # `idris2 --typecheck` can exit 0 with an Error: line (see
      # scripts/check-proofs.sh), so both are checked.
      - name: Typecheck the Idris2 ABI model
        run: |
          set -euo pipefail
          out="$(idris2 --typecheck src/interface/abi.ipkg 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -q '^Error'; then exit 1; fi

      - name: Idris2 -> C ABI -> Zig end-to-end test
        run: |
          set -euo pipefail
          zig build ffi
          idris2 --build src/interface/E2e/abi-e2e.ipkg
          LD_LIBRARY_PATH=zig-out/lib src/interface/E2e/build/exec/abi-e2e \
            tests/testdata/crosscheck.traces tests/testdata/crosscheck-root.anchor

  # Chain-of-trust theory (PROOF-POLICY §1-§2, §8): the Agda source and its Rocq
  # and Lean re-proofs, with one receipt per leg on every commit.
  #
  # PROOF-POLICY §6 deviation (state: open): Agda and Rocq come from Ubuntu's
  # apt archive and Lean from its GitHub release tarball, not from
  # build/guix.scm or the container, which the runner lacks. Each install
  # asserts the exact version, and Lean's tarball its sha256, before use.
  # Record: docs/status/PROOF-STATUS.adoc, "Toolchain deviations".
  theory-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AGDA_DEB: "2.6.3-1build1"
      COQ_DEB: "8.18.0+dfsg-1build2"
      LEAN_VERSION: "4.15.0"
      LEAN_SHA256: "af71a2569a9f68337de2434829b3008cd8e32c436e9cb6bd8c84a2c2ba3585c9"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Agda and Rocq (version-asserted)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q "agda-bin=${AGDA_DEB}" "coq=${COQ_DEB}"
          test "$(dpkg-query -W -f='${Version}' agda-bin)" = "$AGDA_DEB"
          test "$(dpkg-query -W -f='${Version}' coq)" = "$COQ_DEB"
          sha256sum "$(command -v agda)" "$(command -v coqc)"

      - name: Install Lean (checksum-verified)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/lean.tar.zst" \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          echo "${LEAN_SHA256}  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"

      - name: Check every proof MANIFEST (Agda, Rocq, Lean)
        run: |
          set -euo pipefail
          scripts/check-proofs.sh agda
          scripts/check-proofs.sh coq
          scripts/check-proofs.sh lean4

      - name: Chain-of-trust receipts (one per leg, this commit)
        run: |
          set -euo pipefail
          scripts/theory-receipts.sh "$RUNNER_TEMP/theory-receipts.jsonl"
          {
            echo "### Chain-of-trust receipts"
            echo
            echo '```'
            cat "$RUNNER_TEMP/theory-receipts.jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
